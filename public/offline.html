<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1D64F2" />
    <title>Koneksi Terputus | SI TANJAK</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f5f7fa;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
      }
      .logo {
        width: 68px;
        height: 68px;
        border-radius: 16px;
        object-fit: contain;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 800;
        color: #0f172a;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.55;
        color: #475569;
      }
      button {
        width: 100%;
        padding: 12px 18px;
        border: none;
        border-radius: 12px;
        background: #1d64f2;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        src="/images/assets-new/icon-mobile/apple-touch-180.png"
        alt="SI TANJAK"
        class="logo"
      />
      <h1>Tidak Ada Koneksi Internet</h1>
      <p>
        SI TANJAK memerlukan koneksi internet aktif untuk memuat jadwal, absensi, dan logbook Anda secara akurat.
      </p>
      <button type="button" onclick="window.location.reload()">Coba Muat Ulang</button>
    </div>
  </body>
</html>
